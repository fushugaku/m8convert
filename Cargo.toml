[package]
name = "m8convert"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
m8-file-parser = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
xmrs = { version = "0.14.3", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }
xmrsplayer = { version = "0.14.4", default-features = false, features = ["std", "import_mod", "import_xm", "import_s3m", "import_it"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
