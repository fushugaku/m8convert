<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>m8convert</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #f7f7f4;
        color: #191a1d;
      }

      main {
        width: min(920px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      h1 {
        margin: 0 0 24px;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      .panel {
        border: 1px solid #d7d5ce;
        border-radius: 8px;
        background: #ffffff;
        padding: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 650;
      }

      input,
      button,
      a.download-button {
        font: inherit;
      }

      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #c7c5bd;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 16px;
      }

      input[type="text"]:disabled {
        background: #f0efea;
        color: #777b7e;
      }

      .file-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }

      .file-picker {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .file-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        border-radius: 6px;
        background: #202124;
        color: white;
        padding: 10px 14px;
        cursor: pointer;
        font-weight: 650;
      }

      .file-help {
        min-width: 0;
        color: #4f5457;
        font-size: 14px;
      }

      button {
        border: 0;
        border-radius: 6px;
        background: #146c5a;
        color: white;
        padding: 10px 14px;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      a.download-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: fit-content;
        border-radius: 6px;
        background: #146c5a;
        color: white;
        padding: 10px 14px;
        text-decoration: none;
      }

      pre {
        overflow: auto;
        border-radius: 6px;
        background: #202124;
        color: #f4f4ed;
        padding: 16px;
      }

      a {
        color: #145f91;
      }

      .downloads {
        display: none;
        margin-top: 18px;
      }

      .downloads.has-results {
        display: block;
      }

      .result-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .bundle-note {
        margin: 0 0 14px;
        border-left: 3px solid #146c5a;
        background: #eef5f1;
        color: #4f5457;
        font-size: 14px;
        line-height: 1.45;
        padding: 10px 12px;
      }

      .file-list {
        border-top: 1px solid #dedbd2;
        padding-top: 10px;
      }

      .file-list summary {
        cursor: pointer;
        color: #4f5457;
        font-size: 14px;
        user-select: none;
      }

      .file-list ul {
        display: grid;
        gap: 6px;
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
      }

      .file-list a {
        display: block;
        overflow: hidden;
        color: #145f91;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        margin: 12px 0 0;
        color: #4f5457;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>m8convert</h1>
      <section class="panel">
        <label for="song-name">Song name</label>
        <input id="song-name" type="text" maxlength="32" placeholder="Auto from file name" />

        <label for="mod-file">Tracker files</label>
        <div class="file-picker">
          <input id="mod-file" class="file-input" type="file" accept=".mod,.hvl,.s3m,audio/mod,audio/x-mod" multiple />
          <label class="file-button" for="mod-file">Choose files</label>
          <span id="file-help" class="file-help">Supported formats: MOD, HVL, S3M</span>
        </div>

        <button id="convert" disabled>Convert</button>
        <p id="status" class="status">Loading converter...</p>
        <div id="downloads" class="downloads"></div>
        <pre id="report"></pre>
      </section>
    </main>

    <script type="module">
      const buildStamp = "20260531-mapping-pass-1-5";
      const fileInput = document.querySelector("#mod-file");
      const fileHelp = document.querySelector("#file-help");
      const songName = document.querySelector("#song-name");
      const button = document.querySelector("#convert");
      const downloads = document.querySelector("#downloads");
      const report = document.querySelector("#report");
      const status = document.querySelector("#status");

      let converterReady = false;
      let busy = false;
      let convertTrackerToM8BundleJson = null;
      let autoSongName = true;
      let activeUrls = [];

      const selectedFiles = () => Array.from(fileInput.files || []);
      const hasFile = () => selectedFiles().length > 0;
      const refreshButton = () => {
        const files = selectedFiles();
        button.disabled = busy || !converterReady || !hasFile();
        if (busy) {
          status.textContent = "Converting...";
        } else if (!converterReady) {
          status.textContent = "Loading converter...";
        } else if (hasFile()) {
          fileHelp.textContent = fileLabel(files);
          status.textContent = files.length === 1
            ? `${files[0].name} is ready.`
            : `${files.length} files are ready.`;
        } else {
          fileHelp.textContent = "Supported formats: MOD, HVL, S3M";
          status.textContent = "Choose MOD, HVL, or S3M files.";
        }
      };

      fileInput.addEventListener("change", () => {
        syncSongName();
        refreshButton();
      });
      fileInput.addEventListener("input", () => {
        syncSongName();
        refreshButton();
      });
      songName.addEventListener("input", () => {
        autoSongName = false;
      });

      try {
        const module = await import(`./pkg/m8convert.js?v=${buildStamp}`);
        await module.default({ module_or_path: `./pkg/m8convert_bg.wasm?v=${buildStamp}` });
        convertTrackerToM8BundleJson = module.convert_tracker_to_m8_bundle_json;
        converterReady = true;
      } catch (error) {
        report.textContent = `Could not load converter: ${error}`;
      } finally {
        refreshButton();
      }

      button.addEventListener("click", async () => {
        const files = selectedFiles();
        if (files.length === 0) return;

        busy = true;
        refreshButton();
        clearDownloads();
        report.textContent = "Converting...";
        let completedStatus = null;

        try {
          const usedProjectNames = new Set();
          const outputFiles = [];
          const projects = [];

          for (const [index, file] of files.entries()) {
            status.textContent = `Converting ${index + 1}/${files.length}: ${file.name}`;
            await nextFrame();

            const requestedName = files.length === 1 && songName.value.trim()
              ? songName.value.trim()
              : fileBaseName(file.name);
            const projectName = uniqueProjectName(requestedName, usedProjectNames);

            try {
              const input = new Uint8Array(await file.arrayBuffer());
              const raw = convertTrackerToM8BundleJson(input, projectName);
              const bundle = JSON.parse(raw);
              const filesForBundle = bundle.files.map(decodeBundleFile);
              outputFiles.push(...filesForBundle);

              projects.push(projectReport(file, bundle, filesForBundle, "converted"));
            } catch (error) {
              projects.push({
                input_file: file.name,
                song_name: projectName,
                status: "failed",
                error: String(error),
                output_files: [],
                sample_files: 0,
              });
            }
          }

          const batchReport = buildBatchReport(projects, outputFiles);
          const reportBytes = new TextEncoder().encode(JSON.stringify(batchReport, null, 2));
          outputFiles.push({
            path: "m8convert-batch-report.json",
            mime_type: "application/json",
            size: reportBytes.length,
            bytes: reportBytes,
          });

          const zipBlob = new Blob([createZip(outputFiles)], { type: "application/zip" });
          const zipLink = document.createElement("a");
          zipLink.className = "download-button";
          zipLink.href = objectUrl(zipBlob);
          zipLink.download = zipFileName(projects);
          zipLink.textContent = "Download ZIP";

          const actions = document.createElement("div");
          actions.className = "result-actions";
          actions.append(zipLink);

          const bundleNote = document.createElement("p");
          bundleNote.className = "bundle-note";
          bundleNote.textContent = bundleNoteText(projects);

          const fileList = document.createElement("details");
          fileList.className = "file-list";
          const fileSummary = document.createElement("summary");
          fileSummary.textContent = `Output files (${outputFiles.length})`;
          const fileItems = document.createElement("ul");
          fileList.append(fileSummary, fileItems);

          for (const output of outputFiles) {
            const blob = new Blob([output.bytes], { type: output.mime_type });
            const link = document.createElement("a");
            link.href = objectUrl(blob);
            link.download = output.path;
            link.textContent = output.path;
            link.title = output.path;
            const item = document.createElement("li");
            item.append(link);
            fileItems.append(item);
          }

          downloads.classList.add("has-results");
          downloads.append(actions, bundleNote, fileList);
          report.textContent = JSON.stringify(batchReport, null, 2);
          completedStatus = statusText(batchReport);
        } catch (error) {
          report.textContent = String(error);
        } finally {
          busy = false;
          refreshButton();
          if (completedStatus) {
            status.textContent = completedStatus;
          }
        }
      });

      function syncSongName() {
        const files = selectedFiles();
        if (files.length === 1) {
          songName.disabled = false;
          if (autoSongName || !songName.value.trim()) {
            songName.value = fileBaseName(files[0].name);
            autoSongName = true;
          }
        } else {
          songName.disabled = files.length > 1;
          if (files.length > 1) {
            songName.value = "";
            autoSongName = true;
          }
        }
      }

      function fileLabel(files) {
        if (files.length === 1) return files[0].name;
        const names = files.slice(0, 3).map((file) => file.name).join(", ");
        return files.length > 3 ? `${files.length} files: ${names}, ...` : `${files.length} files: ${names}`;
      }

      function fileBaseName(name) {
        const withoutPath = name.split(/[\\/]/).pop() || name;
        return withoutPath.replace(/\.[^.]+$/, "") || "converted_tracker";
      }

      function sanitizeProjectName(name) {
        const sanitized = Array.from(name)
          .map((char) => /[A-Za-z0-9_-]/.test(char) ? char : "_")
          .join("")
          .replace(/^_+|_+$/g, "")
          .slice(0, 32);
        return sanitized || "converted_tracker";
      }

      function uniqueProjectName(name, usedProjectNames) {
        const base = sanitizeProjectName(name);
        let candidate = base;
        let suffix = 2;
        while (usedProjectNames.has(candidate)) {
          const suffixText = `_${suffix}`;
          candidate = `${base.slice(0, 32 - suffixText.length)}${suffixText}`;
          suffix += 1;
        }
        usedProjectNames.add(candidate);
        return candidate;
      }

      function decodeBundleFile(output) {
        return {
          ...output,
          bytes: Uint8Array.from(atob(output.data_base64), (char) => char.charCodeAt(0)),
        };
      }

      function projectReport(inputFile, bundle, outputFiles, status) {
        const sampleFiles = outputFiles.filter((file) => file.path.includes("/Samples/")).length;
        return {
          input_file: inputFile.name,
          song_name: bundle.project_name,
          status,
          source: bundle.report.source,
          m8: bundle.report.m8,
          notes: bundle.report.notes,
          output_file_count: outputFiles.length,
          output_size_bytes: outputFiles.reduce((sum, file) => sum + file.size, 0),
          sample_files: sampleFiles,
          output_files: outputFiles.map(({ path, mime_type, size }) => ({ path, mime_type, size })),
        };
      }

      function buildBatchReport(projects, outputFiles) {
        const converted = projects.filter((project) => project.status === "converted");
        const failed = projects.filter((project) => project.status === "failed");
        return {
          generated_by: "m8convert",
          build: buildStamp,
          selected_files: projects.length,
          converted_files: converted.length,
          failed_files: failed.length,
          output_file_count: outputFiles.length,
          sample_file_count: converted.reduce((sum, project) => sum + project.sample_files, 0),
          output_size_bytes: outputFiles.reduce((sum, file) => sum + file.size, 0),
          projects,
        };
      }

      function zipFileName(projects) {
        const converted = projects.filter((project) => project.status === "converted");
        if (converted.length === 1 && projects.length === 1) {
          return `${converted[0].song_name || "m8convert-bundle"}.zip`;
        }
        return "m8convert-batch.zip";
      }

      function bundleNoteText(projects) {
        const converted = projects.filter((project) => project.status === "converted");
        if (converted.length === 1) {
          return `Extract the ZIP at the M8 SD card root. It already contains Bundles/${converted[0].song_name}/, so the song and samples land in the folder M8 expects.`;
        }
        return "Extract the ZIP at the M8 SD card root. It already contains one Bundles/<ProjectName>/ folder for each converted tracker, plus m8convert-batch-report.json.";
      }

      function statusText(batchReport) {
        if (batchReport.failed_files > 0) {
          return `${batchReport.converted_files}/${batchReport.selected_files} converted, ${batchReport.failed_files} failed.`;
        }
        return `${batchReport.converted_files}/${batchReport.selected_files} converted.`;
      }

      function objectUrl(blob) {
        const url = URL.createObjectURL(blob);
        activeUrls.push(url);
        return url;
      }

      function clearDownloads() {
        for (const url of activeUrls) {
          URL.revokeObjectURL(url);
        }
        activeUrls = [];
        downloads.replaceChildren();
        downloads.classList.remove("has-results");
      }

      function nextFrame() {
        return new Promise((resolve) => requestAnimationFrame(resolve));
      }

      function createZip(files) {
        const localParts = [];
        const centralParts = [];
        let offset = 0;

        for (const file of files) {
          const nameBytes = new TextEncoder().encode(file.path);
          const crc = crc32(file.bytes);
          const localHeader = new Uint8Array(30 + nameBytes.length);
          const localView = new DataView(localHeader.buffer);
          localView.setUint32(0, 0x04034b50, true);
          localView.setUint16(4, 20, true);
          localView.setUint16(6, 0, true);
          localView.setUint16(8, 0, true);
          localView.setUint16(10, dosTime(), true);
          localView.setUint16(12, dosDate(), true);
          localView.setUint32(14, crc, true);
          localView.setUint32(18, file.bytes.length, true);
          localView.setUint32(22, file.bytes.length, true);
          localView.setUint16(26, nameBytes.length, true);
          localHeader.set(nameBytes, 30);
          localParts.push(localHeader, file.bytes);

          const centralHeader = new Uint8Array(46 + nameBytes.length);
          const centralView = new DataView(centralHeader.buffer);
          centralView.setUint32(0, 0x02014b50, true);
          centralView.setUint16(4, 20, true);
          centralView.setUint16(6, 20, true);
          centralView.setUint16(8, 0, true);
          centralView.setUint16(10, 0, true);
          centralView.setUint16(12, dosTime(), true);
          centralView.setUint16(14, dosDate(), true);
          centralView.setUint32(16, crc, true);
          centralView.setUint32(20, file.bytes.length, true);
          centralView.setUint32(24, file.bytes.length, true);
          centralView.setUint16(28, nameBytes.length, true);
          centralView.setUint32(42, offset, true);
          centralHeader.set(nameBytes, 46);
          centralParts.push(centralHeader);

          offset += localHeader.length + file.bytes.length;
        }

        const centralSize = centralParts.reduce((sum, part) => sum + part.length, 0);
        const endHeader = new Uint8Array(22);
        const endView = new DataView(endHeader.buffer);
        endView.setUint32(0, 0x06054b50, true);
        endView.setUint16(8, files.length, true);
        endView.setUint16(10, files.length, true);
        endView.setUint32(12, centralSize, true);
        endView.setUint32(16, offset, true);

        return new Blob([...localParts, ...centralParts, endHeader]);
      }

      function crc32(bytes) {
        let crc = 0xffffffff;
        for (const byte of bytes) {
          crc = (crc >>> 8) ^ crcTable[(crc ^ byte) & 0xff];
        }
        return (crc ^ 0xffffffff) >>> 0;
      }

      const crcTable = Array.from({ length: 256 }, (_, index) => {
        let value = index;
        for (let bit = 0; bit < 8; bit += 1) {
          value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
        }
        return value >>> 0;
      });

      function dosTime() {
        const now = new Date();
        return (now.getHours() << 11) | (now.getMinutes() << 5) | Math.floor(now.getSeconds() / 2);
      }

      function dosDate() {
        const now = new Date();
        return ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
      }
    </script>
  </body>
</html>
