          firmwareInputCalls: after.firmwareInputCalls - before.firmwareInputCalls,
          remoteSerialPumpAttempts: after.remoteSerialPumpAttempts - before.remoteSerialPumpAttempts,
          remoteSerialPumpSuccesses: after.remoteSerialPumpSuccesses - before.remoteSerialPumpSuccesses,
          remoteControllerPollAttempts: after.remoteControllerPollAttempts - before.remoteControllerPollAttempts,
          remoteControllerConsumeSuccesses: after.remoteControllerConsumeSuccesses - before.remoteControllerConsumeSuccesses,
          traceTotal: after.traceTotal - before.traceTotal,
          cycles: after.cycles - before.cycles,
        };

        if (failures.length === 0) {
          if (!after.lastJoypadInputApplied) failures.push(`joypad action "${action}" was not applied`);
          if (delta.displaySlipPacketsProcessed <= 0) {
            failures.push(`joypad action "${action}" emitted no display frame`);
          }
          if (!after.displayContentReady) failures.push("render-cache display was lost after input");
          if (after.stopped) failures.push(`emulator stopped after input: ${after.bootStatus}`);
          if (after.stopEventNote) failures.push(`stop event after input: ${after.stopEventNote}`);
          if (after.lastDisplayError) failures.push(`display parser error after input: ${after.lastDisplayError}`);
        }

        if (after.sdCardPresent && after.sdReadBlocks === 0) {
          const command = after.usdhcLastCommand;
          if (command) {
            warnings.push(
              `SD card is mounted but firmware has not read data blocks; last uSDHC command was CMD${command.command_index} on ${command.instance} x${command.count}`,
            );
          } else {
            warnings.push("SD card is mounted but firmware has not issued uSDHC data-read commands in this smoke path");
          }
        }
        if (
          after.audioObserved
          && after.audioSourceRingNonzeroWords > 0
          && after.audioNonzeroPcmWords === 0
        ) {
          warnings.push("Audio DMA source ring has nonzero samples, but captured PCM is still silent");
        }
        if (!after.audioObserved) {
          warnings.push("Audio MMIO/DMA has not been observed yet");
        }

        return {
          passed: failures.length === 0,
          action,
          failures,
          warnings,
          before,
          after,
          delta,
        };
      }

      function publishSmokeState() {
        const node = document.getElementById("m8-smoke-state");
        if (!node) return;
        node.textContent = JSON.stringify(liveSmokeState());
      }

      function publishSmokeTestResult(payload) {
        const node = document.getElementById("m8-smoke-test-result");
        if (!node) return;
        node.textContent = JSON.stringify(payload);
      }

      window.addEventListener("m8convert-run-smoke-test", async () => {
        const node = document.getElementById("m8-smoke-test-result");
        let options = {};
        if (node?.dataset.options) {
          try {
            options = JSON.parse(node.dataset.options);
          } catch (error) {
            publishSmokeTestResult({
              status: "error",
              error: `Could not parse smoke test options: ${error instanceof Error ? error.message : String(error)}`,
            });
            return;
          }
        }
        publishSmokeTestResult({ status: "running", started_at: new Date().toISOString() });
        try {
          const result = await runM8SmokeTest(options);
          publishSmokeTestResult({
            status: result.passed ? "passed" : "failed",
            finished_at: new Date().toISOString(),
            result,
          });
        } catch (error) {
          publishSmokeTestResult({
            status: "error",
            finished_at: new Date().toISOString(),
            error: error instanceof Error ? error.message : String(error),
          });
        }
      });

      window.__m8convertTestHooks = {
        renderAnalysis,
        renderDisplaySnapshot,
        bootProbeStatusText,
        smokeState: liveSmokeState,
        runSmokeTest: async (options) => runM8SmokeTest(options),
        tapAndReport: async (action, holdMs) => {
          await window.__m8convertEmulatorControls.tap(action, holdMs);
          return liveSmokeState();
        },
      };
    </script>
  </body>
</html>
